  <body class="bg-body-tertiary">
    <a class="visually-hidden-focusable" href="#main">Skip to jobs</a>
    <main class="container-lg py-4" id="main">
      <h1 class="h3">Sample job listings</h1>
      <p class="text-muted">Fictional employers for demo only. Filter by support that matters to you — nothing is sent to the network when you filter.</p>
      <fieldset class="mb-4" aria-describedby="filter-status">
        <legend class="h5">Match my support needs</legend>
        <div id="filter-options" class="row g-2"></div>
        <p id="filter-status" class="mt-2" aria-live="polite"></p>
        <button type="button" class="btn btn-link p-0" id="forget-support">Forget my saved choices on this phone</button>
      </fieldset>
      <section id="job-list" aria-label="Open roles"></section>
    </main>
    <dialog id="apply-dialog" aria-labelledby="apply-title">
      <h2 id="apply-title" class="h5">Apply</h2>
      <p id="apply-context" class="text-muted"></p>
      <div id="embed-host"></div>
      <button type="button" class="btn btn-secondary mt-2" id="close-apply">Close</button>
    </dialog>
