# docker compose up --build   → http://localhost:3000
# Values come from .env (copy .env.example). Leave ADDIS_API_KEY and GEMINI_API_KEY empty to run with AI off.
services:
  mezgeb:
    build: .
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MEZGEB_SPEECH=${MEZGEB_SPEECH:-}
      - ADDIS_API_KEY=${ADDIS_API_KEY:-}
      - ADDIS_STT_BACKEND=${ADDIS_STT_BACKEND:-turbo}
      - ADDIS_TTS_VOICE=${ADDIS_TTS_VOICE:-}
      - MEZGEB_TTS=${MEZGEB_TTS:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - MEZGEB_SITE_KEYS=${MEZGEB_SITE_KEYS:-}
      - MEZGEB_ALLOWED_ORIGINS=${MEZGEB_ALLOWED_ORIGINS:-}
      - MEZGEB_TOKEN_TTL_MS=${MEZGEB_TOKEN_TTL_MS:-300000}
    restart: unless-stopped
