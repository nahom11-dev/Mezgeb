<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account · Kelem Learn (sample site)</title>
<style>
  :root{
    --bg:#FFFFFF; --ink:#14213D; --muted:#5A6275; --line:#DDE2EA;
    --brand:#1D5FD1; --brand-ink:#FFFFFF; --soft:#EEF3FC; --warm:#FFF7E8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Ethiopic",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  a{color:var(--brand)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #F2A900;outline-offset:2px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  .skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;background:#fff;padding:8px 12px;z-index:10}
  header{border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:24px;min-height:64px;flex-wrap:wrap}
  .logo{font-weight:700;font-size:20px;text-decoration:none;color:var(--ink)}
  .logo span{color:var(--brand)}
  nav ul{list-style:none;display:flex;gap:20px;margin:0;padding:0;flex-wrap:wrap}
  nav a{text-decoration:none;color:var(--ink)}
  nav a[aria-current="page"]{font-weight:600;text-decoration:underline;text-underline-offset:6px}
  .bar .right{margin-left:auto;display:flex;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:600 15px inherit;text-decoration:none;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--brand)}
  .hero{background:var(--soft);padding:72px 0}
  .hero h1{font-size:clamp(32px,5vw,48px);line-height:1.15;margin:0 0 16px;max-width:640px}
  .hero p{font-size:18px;color:var(--muted);max-width:560px;margin:0 0 24px}
  section{padding:64px 0}
  h2{font-size:28px;margin:0 0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
  .course{border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px}
  .course h3{margin:0;font-size:18px}
  .tag{font-size:13px;color:var(--muted)}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;counter-reset:s}
  .steps li{list-style:none;border-top:3px solid var(--brand);padding-top:12px}
  .steps{padding:0}
  footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:14px}
  .sample-note{background:var(--warm);border-bottom:1px solid #F0DDB5;font-size:14px;padding:8px 0;text-align:center}
  /* Sign-up page */
  .view{display:none}.view.active{display:block}
  .signup{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;align-items:start}
  .slot{border:2px dashed #9AA8C2;border-radius:12px;min-height:420px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;color:var(--muted);background:#FAFBFD}
  .slot code{background:#EEF1F6;padding:2px 6px;border-radius:4px;font-size:13px}
  .old-form{display:flex;flex-direction:column;gap:14px}
  label{font-weight:600;font-size:15px}
  input,select{width:100%;min-height:44px;border:1px solid #AEB7C7;border-radius:6px;padding:0 12px;font:16px inherit}
  .field{display:flex;flex-direction:column;gap:6px}
  .hint{font-size:14px;color:var(--muted);font-weight:400}
  .panel{border:1px solid var(--line);border-radius:12px;padding:24px}
  dl{display:grid;grid-template-columns:160px 1fr;gap:8px 16px;margin:0}
  dt{color:var(--muted)}dd{margin:0}
  @media (max-width:640px){dl{grid-template-columns:1fr}.bar .right{margin-left:0}}
</style>
<style>
  /* Onboarding page: intentionally empty. */
  .onboarding-main{min-height:70vh;padding:40px 0}
</style>
<script type="module" src="/v1/mezgeb.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="sample-note">Sample website for testing Mezgeb. Kelem Learn is not a real organisation.</div>

<header>
  <div class="wrap bar">
    <a class="logo" href="index.html#home">Kelem<span>Learn</span></a>
    <nav aria-label="Main">
      <ul>
        <li><a href="index.html#home" data-nav="home">Home</a></li>
        <li><a href="index.html#courses" data-nav="courses">Courses</a></li>
        <li><a href="index.html#account" data-nav="account">My account</a></li>
      </ul>
    </nav>
    <div class="right">
      <a class="btn ghost" href="index.html#account">Log in</a>
      <a class="btn" href="onboarding.html">Sign up</a>
    </div>
  </div>
</header>

<main id="main" class="onboarding-main">
  <div class="wrap">
    <div id="mezgeb-root">
      <mezgeb-register site-key="pk_sample_kelem" template="learning-platform" lang="am" platform-name="Kelem Learn" api-base="http://localhost:3000"></mezgeb-register>
    </div>
    <script type="module">
      const MEZGEB = "http://localhost:3000";
      const SITE_KEY = "pk_sample_kelem";
      const STORE_KEY = "kelem_learn_user";
      document.querySelector("mezgeb-register")?.addEventListener("mezgeb:complete", async (ev) => {
        const token = ev.detail?.token;
        if (!token) return;
        const res = await fetch(`${MEZGEB}/api/sample/registrations/exchange`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, siteKey: SITE_KEY }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) return;
        const p = data.profile || {};
        const record = {
          source: "Mezgeb",
          name: p.full_name || p.name || "",
          phone: p.phone || "",
          email: p.email || "",
          date_of_birth: p.date_of_birth || "",
          education: p.education || p.education_level || "",
        };
        try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...record, ...p })); } catch (e) {}
        location.href = "index.html#account";
      });
    </script>
  </div>
</main>

<footer>
  <div class="wrap">Kelem Learn · Sample site for testing. All courses and data are made up. · <a href="index.html#signup">Old sign-up form (for comparison)</a></div>
</footer>
</body>
</html>
